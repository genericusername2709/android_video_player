[package]
name = "android_video_player"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ndk = { version = "0.9", features = ["rwh_06"] }
ndk-sys = "0.5"
ndk-context = "0.1"

# Handles native Android app lifecycle (Glue layer)
android-activity = { version = "0.6", features = ["native-activity"] }
# Multi-backend GPU rendering engine
wgpu = "0.19"
# Interop for window handles
raw-window-handle = "0.6"
# Logging redirected to Android logcat
android_logger = "0.13"
log = "0.4"
pollster = "0.3"
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui = "0.27"
egui-wgpu = "0.27"

[package.metadata.android]
manifest = "AndroidManifest.xml"
package_name = "com.example.android_video_player"
label = "TVideoPlayer"
target_sdk_version = 34
min_sdk_version = 21
build_targets = ["aarch64-linux-android"]
